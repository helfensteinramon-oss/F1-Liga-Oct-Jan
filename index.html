function hasData(s){if(!s)return false;return ['race','sprint','roster','raceDates'].some(k=>s[k]&&Object.keys(s[k]).length)}

async function cloudLoad(ask=true){try{cloudStatus('Cloud wird geladen …');let x=await cloudGet();if(!hasData(x?.data)){cloudStatus('Cloud ist noch leer · lokale Daten bleiben erhalten','warn');return}if(ask&&hasData(state)&&!confirm('Cloud-Stand laden und den lokalen Stand auf diesem Gerät ersetzen?'))return;state=Object.assign(fresh(),x.data);localSaveOnly();renderAll();cloudStatus(cloudSession?'Cloud synchronisiert · Editor':'Cloud synchronisiert · Nur Lesen','ok')}catch(e){cloudStatus('Cloud nicht erreichbar · lokal aktiv','bad');if(ask)alert('Cloud konnte nicht geladen werden: '+e.message)}}
async function cloudSave(){
 if(!cloudSession?.access_token)return;
 try{
  cloudStatus('Cloud wird gespeichert …');
  const stamp=new Date().toISOString();
  let r=await fetch(SUPABASE_URL+'/rest/v1/league_state?id=eq.1',{
   method:'PATCH',headers:authHeaders(),
   body:JSON.stringify({data:state,updated_at:stamp})
  });
  const txt=await r.text();
  if(!r.ok)throw Error('HTTP '+r.status+' '+txt);
  let rows=[];try{rows=txt?JSON.parse(txt):[]}catch(e){}
  if(!Array.isArray(rows)||rows.length!==1)throw Error('Supabase hat keine Zeile aktualisiert. Prüfe die RLS-SELECT-Policy für authenticated.');
  let verify=await fetch(SUPABASE_URL+'/rest/v1/league_state?id=eq.1&select=data,updated_at',{headers:{apikey:SUPABASE_KEY},cache:'no-store'});
  if(!verify.ok)throw Error('Kontroll-Lesen fehlgeschlagen: HTTP '+verify.status+' '+await verify.text());
  let vr=(await verify.json())[0];
  if(!vr||!hasData(vr.data))throw Error('Kontrolle fehlgeschlagen: Die Cloud enthält weiterhin keine Liga-Daten.');
  const local=JSON.stringify(state), remote=JSON.stringify(vr.data);
  if(local!==remote)throw Error('Kontrolle fehlgeschlagen: Cloud-Daten stimmen nicht mit dem lokalen Stand überein.');
  cloudUpdated=vr.updated_at||stamp;cloudUI();
  cloudStatus('Cloud synchronisiert · Speicherung verifiziert','ok');
 }catch(e){
  cloudStatus('Cloud-Speichern fehlgeschlagen · lokal gesichert','bad');
  alert('Cloud-Speichern fehlgeschlagen:\n\n'+e.message+'\n\nDeine lokalen Liga-Daten bleiben erhalten.');

}

async function handlePasswordRecovery(){
 const p=new URLSearchParams(location.hash.replace(/^#/,''));
 const access=p.get('access_token'),refresh=p.get('refresh_token'),type=p.get('type');
 if(type!=='recovery'||!access)return false;
 cloudSession={access_token:access,refresh_token:refresh||'',token_type:'bearer',expires_in:Number(p.get('expires_in')||3600)};
 localStorage.setItem(AUTH_KEY,JSON.stringify(cloudSession));cloudUI();cloudStatus('Passwort-Wiederherstellung aktiv','warn');
 setTimeout(async()=>{
  const pw=prompt('Neues Editor-Passwort festlegen:');
  if(!pw)return;
  const pw2=prompt('Neues Passwort wiederholen:');
  if(pw!==pw2){alert('Die Passwörter stimmen nicht überein.');return}
  try{
   const r=await fetch(SUPABASE_URL+'/auth/v1/user',{method:'PUT',headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+access,'Content-Type':'application/json'},body:JSON.stringify({password:pw})});
   if(!r.ok)throw Error(await r.text());
   history.replaceState(null,'',location.pathname+location.search);
   cloudStatus('Passwort geändert · Editor angemeldet','ok');
   alert('Passwort erfolgreich geändert. Du bist jetzt als Editor angemeldet.');
   const row=await cloudGet();
   if(!hasData(row?.data)&&hasData(state)&&confirm('Die Cloud ist noch leer. Deinen aktuellen lokalen Saisonstand jetzt in die Cloud übernehmen?'))await cloudSave();
  }catch(e){cloudStatus('Passwortänderung fehlgeschlagen','bad');alert('Passwort konnte nicht geändert werden: '+e.message)}
 },250);
 return true;
}

function logo(team){
 let src=TEAM_LOGOS[team];
 if(!src)return `<span class="logo">${esc(team)}</span>`;
 return `<span class="logo teamlogo"><img src="${src}" alt="${esc(team)} Logo"></span>`;
}

function blankRow(){return {pos:'',fl:0,pole:0,pen:0,ingame:'',manual:'',note:''}}
function getRec(kind,no,name){state[kind][no]??={};state[kind][no][name]??=blankRow();return state[kind][no][name]}
function basePoints(kind,pos){let n=parseInt(pos,10); if(!Number.isFinite(n))return 0; return (kind==='race'?GPPTS:SPPTS)[n]||0}
function total(kind,r){return basePoints(kind,r.pos)+(Number(r.fl)===1?1:0)-(Number(r.pen)||0)}
function posOptions(v){let a=['<option value="">–</option>'];for(let i=1;i<=22;i++)a.push(`<option ${String(v)===String(i)?'selected':''}>${i}</option>`);for(const s of ['DNF','KI','DSQ','DNS','0'])a.push(`<option ${String(v)===s?'selected':''}>${s}</option>`);return a.join('')}
function rosterEntry(d){
 if(!state.roster)state.roster={};
 if(!state.roster[d.team])state.roster[d.team]={};
 let base=DRIVERS.filter(x=>x.team===d.team),slot=base.findIndex(x=>x.name===d.name),key='slot'+slot;
 if(!state.roster[d.team][key])state.roster[d.team][key]={name:d.name,nick:d.nick};
 return state.roster[d.team][key];
}
function effectiveDrivers(){return DRIVERS.map(d=>{let r=rosterEntry(d);return {...d,name:r.name||d.name,nick:r.nick||''}})}
function migrateDriverData(oldName,newName){
 if(!oldName||!newName||oldName===newName)return;
 ['race','sprint'].forEach(kind=>Object.values(state[kind]||{}).forEach(round=>{
  if(round&&Object.prototype.hasOwnProperty.call(round,oldName)&&!Object.prototype.hasOwnProperty.call(round,newName)){round[newName]=round[oldName];delete round[oldName]}
 }));
}
function dateCH(s){if(!s)return '–';let [y,m,d]=s.split('-');return `${d}.${m}.${y}`}
function raceDate(no){let meta=RACES.find(x=>x.no===no);return state.raceDates[no]||meta.date}
function setRaceDate(no,value){state.raceDates[no]=value;save();renderEntry('race');renderEntry('sprint');renderCalendar();renderOverview();renderDriverStats()}
function duplicateNumericPlaces(kind,no){
 let used={};
 effectiveDrivers().forEach(d=>{let p=String(getRec(kind,no,d.name).pos||'');if(/^(?:[1-9]|1\d|2[0-2])$/.test(p)){(used[p]??=[]).push(d.name)}});
 return used;
}
function validPosOptions(kind,no,name,current){
 let used=duplicateNumericPlaces(kind,no);
 let a=['<option value="">–</option>'];
 for(let i=1;i<=22;i++){
   let taken=used[String(i)] && !used[String(i)].includes(name);
   a.push(`<option value="${i}" ${String(current)===String(i)?'selected':''} ${taken?'disabled':''}>${i}${taken?' · vergeben':''}</option>`);
 }
 for(const s of ['DNF','KI','DSQ','DNS','0'])a.push(`<option ${String(current)===s?'selected':''}>${s}</option>`);
 return a.join('');
}
function renderEntry(kind){
 let isS=kind==='sprint', no=isS?state.selectedSprint:state.selectedRace, meta=RACES.find(x=>x.no===no);
 let opts=RACES.map(r=>`<option value="${r.no}" ${r.no===no?'selected':''}>${isS?'Sprint ':''}${r.no} · ${r.track} · ${dateCH(raceDate(r.no))}</option>`).join('');
 let rows=effectiveDrivers().map((d,i)=>{
   let r=getRec(kind,no,d.name);
   let poleCell=isS?'':`<td><input class="pole" type="checkbox" ${Number(r.pole)===1?'checked':''}></td>`;
   return `<tr data-driver="${esc(d.name)}"><td>${logo(d.team)}</td><td><div class="driver">${esc(d.name)}</div><div class="nick">${esc(d.nick)}</div></td><td><select class="pos">${validPosOptions(kind,no,d.name,r.pos)}</select></td><td class="base points">${basePoints(kind,r.pos)}</td>${poleCell}<td><input class="fl" type="checkbox" ${Number(r.fl)===1?'checked':''}></td><td><input class="pen smallin" type="number" min="0" step="1" value="${esc(r.pen||0)}"></td><td class="sum points">${total(kind,r)}</td><td class="ingame-check-cell"><input class="ing" type="checkbox" ${Number(r.ingame)===2?'checked':''} title="In-game Strafe: +2 CD-Punkte"><span class="ingame-cd-label">${Number(r.ingame)===2?'+2':'–'}</span></td><td><input class="man smallin" type="number" min="0" step="1" value="${esc(r.manual??'')}"></td><td><input class="note" value="${esc(r.note||'')}" placeholder="Notiz"></td></tr>`
 }).join('');
 let cal=!isS?`<div class="field"><label>📅 Renndatum</label><input id="raceDateInput" type="date" value="${esc(raceDate(no))}"></div>`:`<div class="field"><label>📅 Renndatum</label><input type="date" value="${esc(raceDate(no))}" disabled title="Das Datum wird beim zugehörigen Meisterschaftsrennen geändert."></div>`;

function makeTableSortable(sel){
 let table=document.querySelector(sel);if(!table||!table.tBodies[0]||!table.tBodies[0].rows.length)return;
 let body=table.tBodies[0], count=body.rows[0].cells.length, candidates=[...table.tHead.querySelectorAll('th')];
 let heads=candidates.filter(th=>th.colSpan===1);
 // map each physical column to the most suitable header
 let top=[...table.tHead.rows[0].cells], bottom=table.tHead.rows.length>1?[...table.tHead.rows[table.tHead.rows.length-1].cells]:[];
 let mapped=[];
 if(top.length===count)mapped=top; else if(bottom.length===count)mapped=bottom; else mapped=heads.slice(0,count);
 mapped.forEach((th,col)=>{
   let label=th.textContent.trim().replace(/\s*[↕↑↓]$/,'');th.dataset.sortLabel=label;
   th.textContent=label+' ↕';th.style.cursor='pointer';th.title='Sortieren';
   th.onclick=()=>{
     let asc=th.dataset.dir!=='asc';
     mapped.forEach(h=>{h.dataset.dir='';h.textContent=h.dataset.sortLabel+' ↕'});
     th.dataset.dir=asc?'asc':'desc';th.textContent=label+(asc?' ↑':' ↓');
     let rows=[...body.rows], get=r=>{
       let x=(r.cells[col]?.textContent||'').trim(), n=x.replace(/[’'\s]/g,'').replace(',','.');
       return /^[+\-]?\d+(\.\d+)?$/.test(n)?[0,parseFloat(n)]:[1,x.toLowerCase()];
     };
     rows.sort((a,b)=>{let A=get(a),B=get(b),c=A[0]===0&&B[0]===0?A[1]-B[1]:String(A[1]).localeCompare(String(B[1]),'de-CH',{numeric:true});return asc?c:-c});
     rows.forEach(r=>body.appendChild(r));
   };
 });
}

}function renderData(){document.getElementById('data').innerHTML=`<div class="panel"><h2 class="section-title">Daten & Sicherung</h2><div class="toolbar no-print"><button class="btn" id="exportJson">Sicherung als JSON</button><label class="btn secondary" style="display:inline-flex;align-items:center">JSON importieren<input id="importJson" type="file" accept="application/json" hidden></label><button class="btn secondary" id="exportCsv">Fahrerwertung CSV</button><button class="btn danger" id="resetAll">Alle Daten löschen</button></div><p class="note">Die Eingaben werden automatisch lokal in diesem Browser gespeichert. Für einen Gerätewechsel oder als Backup bitte regelmässig eine JSON-Sicherung exportieren. Das HTML selbst bleibt eine einzelne, eigenständige Datei.</p></div><div class="panel"><h2 class="section-title">Teams & Logos</h2><div class="logo-grid">${[...new Set(DRIVERS.map(d=>d.team))].map(t=>`<div class="logo-card">${logo(t)}<b>${esc(t)}</b></div>`).join('')}</div></div>`;
 document.getElementById('exportJson').onclick=()=>download('F1_Liga_Backup.json',JSON.stringify(state,null,2),'application/json');document.getElementById('exportCsv').onclick=()=>{let ds=driverStats(), lines=['Platz;Team;Fahrer;Punkte;Strafpunkte;FL;DNS;Siege;DNF'];ds.forEach((d,i)=>lines.push([i+1,d.team,d.name,d.points,d.pen,d.fl,d.dns,d.wins,d.dnf].join(';')));download('F1_Liga_Fahrerwertung.csv','\ufeff'+lines.join('\n'),'text/csv')};document.getElementById('importJson').onchange=e=>{let f=e.target.files[0];if(!f)return;let rd=new FileReader();rd.onload=()=>{try{state=Object.assign(fresh(),JSON.parse(rd.result));save();renderEverything();alert('Sicherung importiert.')}catch(err){alert('Ungültige JSON-Datei.')}};rd.readAsText(f)};document.getElementById('resetAll').onclick=()=>{if(confirm('Wirklich ALLE erfassten Renndaten löschen?')){state=fresh();save();renderEverything()}}}
function download(name,text,type){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}

function matrixClass(pos){
 let p=parseInt(pos,10);
 if([1,2,3].includes(p))return 'res-podium';
 if(Number.isFinite(p))return 'res-points';
 if(['DNF','DNS','DSQ','KI'].includes(String(pos)))return 'res-out';
 return 'res-empty';
}
function sprintActuallyHeld(no){
 return effectiveDrivers().some(d=>String(getRec('sprint',no,d.name).pos||'')!=='');
}

function printSeasonOverview(){
 document.body.classList.add('print-overview');
 const cleanup=()=>{document.body.classList.remove('print-overview');window.removeEventListener('afterprint',cleanup)};
 window.addEventListener('afterprint',cleanup);
 setTimeout(()=>window.print(),80);
}
function renderOverview(){
 let el=document.getElementById('overview');if(!el)return;
 let weekends=RACES.map(r=>({r,hasSprint:sprintActuallyHeld(r.no)}));
 let head1=weekends.map(x=>`<th colspan="${x.hasSprint?2:1}">R${x.r.no} · ${esc(x.r.track)}<span class="matrix-head-date">${dateCH(raceDate(x.r.no))}</span></th>`).join('');
 let head2=weekends.map(x=>x.hasSprint?`<th>SPR</th><th>HAU</th>`:`<th>HAU</th>`).join('');
 let ds=driverStats();
 let rows=ds.map((d,idx)=>{
   let cells=weekends.map(x=>{
     let m=getRec('race',x.r.no,d.name);
     let main=`<td class="rescell ${matrixClass(m.pos)}">${esc(m.pos||'')}</td>`;
     if(!x.hasSprint)return main;
     let sp=getRec('sprint',x.r.no,d.name);
     return `<td class="rescell ${matrixClass(sp.pos)}">${esc(sp.pos||'')}</td>${main}`;
   }).join('');
   return `<tr><td class="sticky1"><b>${idx+1}. ${esc(d.name)}</b><div class="nick">${esc(d.nick)}</div></td><td class="sticky2">${esc(d.team)}</td>${cells}<td class="points">${d.points}</td></tr>`;
 }).join('');
 el.innerHTML=`<div class="panel"><div class="calendar-actions no-print"><button class="btn secondary" onclick="printSeasonOverview()">Übersicht als PDF / drucken</button></div><h2 class="section-title">Saisonübersicht · Fahrerresultate</h2><p class="note no-print"><b>PDF-Tipp:</b> Die Druckansicht ist für <b>A3 Querformat</b> optimiert, damit alle 25 Rennen auf eine Seite passen. Im Druckdialog A3 und Querformat wählen; Kopf- und Fusszeilen des Browsers am besten deaktivieren.</p><p class="note">Standardmässig wird pro Rennwochenende nur das Hauptrennen angezeigt. Eine <b>SPR</b>-Spalte erscheint automatisch, sobald für dieses Wochenende mindestens ein Sprintresultat erfasst wurde.</p><div class="matrix-legend"><span class="legend-chip res-podium">Top 3</span><span class="legend-chip res-points">Klassifiziert</span><span class="legend-chip res-out">DNF / DNS / DSQ / KI</span></div><div class="tablebox"><table class="season-matrix equal-cols"><thead><tr><th rowspan="2" class="sticky1">Fahrer</th><th rowspan="2" class="sticky2">Team</th>${head1}<th rowspan="2">Punkte</th></tr><tr>${head2}</tr></thead><tbody>${rows}</tbody></table></div></div>`;
}
function racePodium(no){
 let entries=effectiveDrivers().map(d=>({d,r:getRec('race',no,d.name)}))
   .filter(x=>/^(?:1|2|3)$/.test(String(x.r.pos)))
   .sort((a,b)=>+a.r.pos-+b.r.pos);
 if(entries.length<3)return [];
 return entries.map(x=>({pos:+x.r.pos,name:x.d.name,team:x.d.team}));
}
function renderCalendar(){
 let cards=RACES.map(r=>{
   let pod=racePodium(r.no),done=pod.length===3;
   let podium=done?`<div class="podium">${pod.map(p=>`<div class="podium-row"><span class="podium-pos">${p.pos}.</span><span><b>${esc(p.name)}</b><div class="podium-team">${esc(p.team)}</div></span><span>${logo(p.team)}</span></div>`).join('')}</div>`:`<div class="podium"><span class="note">Noch kein vollständiges Top-3-Ergebnis erfasst.</span></div>`;
   return `<div class="cal-card ${done?'done':''}"><div class="cal-head"><div><div class="cal-no">Rennen ${r.no}</div><div class="cal-track">${esc(r.track)}</div><div class="cal-date">📅 ${dateCH(raceDate(r.no))}</div>${SPRINTS.includes(r.no)?'<span class="cal-sprint">SPRINT GEPLANT</span>':''}</div><div>${done?'<span class="status">GEFAHREN</span>':''}</div></div>${podium}</div>`;
 }).join('');
 let el=document.getElementById('calendar');if(!el)return;
 el.innerHTML=`<div class="panel"><div class="calendar-actions no-print"><button class="btn secondary" onclick="window.print()">Rennkalender drucken / PDF</button></div><h2 class="section-title">Rennkalender · Saison 2026/27</h2><p class="note">Alle Meisterschaftsrennen auf einen Blick. Änderungen am Renndatum unter «Rennen erfassen» werden hier automatisch übernommen. Sobald die Plätze 1–3 eines Rennens erfasst sind, erscheint das Podium direkt im Kalender.</p><div class="calendar-grid">${cards}</div></div>`;
}
function exportStandingPDF(which){
 renderDrivers();renderTeams();
 const source=document.querySelector('#'+which+' table');
 const title=which==='drivers'?'Fahrerwertung':'Teamwertung';
 const headers=[...source.querySelectorAll('thead th')].map((th,i)=>({i,label:th.innerText.trim().replace(/\s+/g,' ')}));
 let old=document.getElementById('pdfChooser');if(old)old.remove();
 let modal=document.createElement('div');modal.id='pdfChooser';modal.className='pdfmodal';
 modal.innerHTML=`<div class="pdfbox"><h2>${title} als PDF</h2><p class="note">Wähle aus, welche Daten in der PDF-Ausgabe erscheinen sollen.</p><div class="pdfchecks">${headers.map(h=>`<label class="pdfcheck"><input type="checkbox" data-col="${h.i}" checked> ${esc(h.label)}</label>`).join('')}</div><div class="pdfactions"><button class="btn secondary" id="pdfNone">Keine</button><button class="btn secondary" id="pdfAll">Alle</button><button class="btn secondary" id="pdfCancel">Abbrechen</button><button class="btn" id="pdfCreate">PDF erstellen</button></div></div>`;
 document.body.appendChild(modal);
 document.getElementById('pdfAll').onclick=()=>modal.querySelectorAll('input').forEach(x=>x.checked=true);
 document.getElementById('pdfNone').onclick=()=>modal.querySelectorAll('input').forEach(x=>x.checked=false);
 document.getElementById('pdfCancel').onclick=()=>modal.remove();
 document.getElementById('pdfCreate').onclick=()=>{
   let selected=[...modal.querySelectorAll('input:checked')].map(x=>+x.dataset.col);
   if(!selected.length){alert('Bitte mindestens eine Spalte auswählen.');return}
   modal.remove();createStandingPDF(which,selected,title);
 };
}
function createStandingPDF(which,selected,title){
 const original=document.querySelector('#'+which+' table');
 const table=original.cloneNode(true);
 [...table.querySelectorAll('tr')].forEach(tr=>[...tr.children].forEach((cell,i)=>{if(!selected.includes(i))cell.remove()}));
 const w=window.open('','_blank','width=1400,height=900');
 if(!w){alert('Das PDF-Fenster wurde vom Browser blockiert. Bitte Pop-ups für diese Datei erlauben.');return}
 const css=[...document.querySelectorAll('style')].map(s=>s.innerHTML).join('\n');
 const subtitle=`Stand: ${new Date().toLocaleDateString('de-CH')} · Saison 2026/27`;
 w.document.write(`<!doctype html><html lang="de"><head><meta charset="utf-8"><title>F1 Liga · ${title}</title><style>${css}
 body{padding:20px;background:white;color:#111}.wrap{max-width:none;padding:0}.panel{box-shadow:none;background:white;border:0}.logo svg *{stroke:#111}.logo svg text{fill:#111}
 table{min-width:0;background:white}th{position:static;background:#ddd;color:#111}td{border-color:#ccc}.nick{color:#555}
 @page{size:landscape;margin:8mm}
 </style></head><body><div class="wrap"><h1>F1 Liga · ${title}</h1><p>${subtitle}</p><div class="tablebox">${table.outerHTML}</div></div><script>window.onload=()=>setTimeout(()=>window.print(),250)<\/script></body></html>`);
 w.document.close();
}

function applyRolePermissions(){
 const editor=!!cloudSession?.access_token;
 document.body.classList.toggle('spectator-mode',!editor);
 const editWords=['leeren','speichern','import','zurücksetzen','reset','löschen','übernehmen'];
 document.querySelectorAll('button').forEach(b=>{
   const t=(b.textContent||'').trim().toLowerCase();
   if(editWords.some(w=>t.includes(w)) && !t.includes('cloud laden')){
      b.dataset.editorAction='1';
      if(!editor)b.style.display='none'; else b.style.display='';
   }
 });
 document.querySelectorAll('input,select,textarea').forEach(el=>{
   if(!editor){
     if(!el.dataset.rolePrevDisabled) el.dataset.rolePrevDisabled=el.disabled?'1':'0';
     el.disabled=true;
   }else if(el.dataset.rolePrevDisabled){
     el.disabled=el.dataset.rolePrevDisabled==='1';
     delete el.dataset.rolePrevDisabled;
   }
 });
 updateAccessModeLabel();
}
const _roleObserver=new MutationObserver(()=>applyRolePermissions());
_roleObserver.observe(document.body,{childList:true,subtree:true});
setTimeout(applyRolePermissions,0);
